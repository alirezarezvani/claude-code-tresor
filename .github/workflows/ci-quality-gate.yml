---
name: CI Quality Gate

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to run quality gate against
        required: false
  repository_dispatch:
    types: [ci-quality]

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Tests, Docs, Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.ref }}" ]]; then
            echo "target_ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" && -n "${{ github.event.client_payload.ref }}" ]]; then
            echo "target_ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_ref=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.target_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install yamllint==1.35.1 check-jsonschema==0.28.4 \
            PyYAML==6.0.2 jsonschema==4.23.0
          # ShellCheck is preinstalled on ubuntu-latest; confirm it's present.
          shellcheck --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: YAML lint (.github/workflows)
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 160}}}' .github/workflows

      - name: Validate GitHub workflow schemas
        run: |
          # Exclude smart-sync.yml (uses projects_v2_item event not in standard schema)
          for file in .github/workflows/*.yml; do
            if [[ "$file" != *"smart-sync.yml" ]]; then
              check-jsonschema --builtin-schema github-workflows "$file"
            fi
          done

      - name: Validate frontmatter (skills, agents, commands)
        run: python3 scripts/validate_frontmatter.py all

      - name: Check agent and skill cross-references
        run: python3 scripts/check_agent_references.py

      - name: Check documented counts match repo state
        run: python3 scripts/check_doc_counts.py

      - name: ShellCheck install/update scripts
        run: |
          # Severity=error blocks on real bugs (syntax, command injection,
          # broken expansions). Pre-existing SC2155/SC2115 warnings tracked
          # separately — fix incrementally and bump severity later.
          shellcheck --severity=error scripts/install.sh scripts/update.sh \
            scripts/smoke_install.sh

      - name: Smoke-test install and update
        run: bash scripts/smoke_install.sh

      - name: Markdown link spot-check (internal links only)
        run: |
          npx --yes markdown-link-check@3.12.2 \
            --config .markdown-link-check.json \
            README.md CLAUDE.md NAVIGATION.md

      - name: Summarize results
        if: always()
        run: |
          echo "Quality gate completed with status: ${{ job.status }}"
