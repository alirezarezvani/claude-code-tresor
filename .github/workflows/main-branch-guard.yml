---
name: Main Branch Protection Guard

# main only ever moves to a released commit of dev. release.yml does
# that by fast-forwarding main, so pull requests into main are rare.
# Any pull request into main from a branch other than dev fails here.

'on':
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-dev-only:
    name: Enforce dev → main Only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "dev → main: allowed"
            exit 0
          fi
          echo "::error::Pull requests into main must come from dev. Open this PR against dev instead."
          exit 1

      - name: Explain on the PR
        if: failure() && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Thanks for the PR! Changes go into `dev` first; `main` only receives released versions.',
                '',
                'Please change the base branch of this PR to `dev` (Edit, next to the title).',
              ].join('\n'),
            });
