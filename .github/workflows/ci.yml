---
name: CI

# Validates every pull request. Pushes to `dev` are validated by
# release.yml, which calls this workflow before it releases anything.
# The `automerge` job merges trusted pull requests into `dev` once
# validation passes (rules in the job). New CI gates (for example
# plugin evals) go in as jobs; add them to `automerge.needs`.

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # Feature branches PR into dev. Allowed prefixes cover conventional
          # types, automation bots, and Claude AI sessions. release-please
          # opens its release PR from release-please--branches--dev--...
          pattern='^(feat|fix|docs|chore|refactor|test|build|ci|perf|style|hotfix|release|claude|dependabot|renovate)/[a-z0-9][a-z0-9._/-]*$'
          if [[ "$BRANCH" =~ $pattern || "$BRANCH" == "dev" || "$BRANCH" == release-please--* ]]; then
            echo "::notice::branch '$BRANCH' OK"
          else
            echo "::error::branch '$BRANCH' must match $pattern"
            exit 1
          fi

      - name: Note release PR (skip naming + commitlint)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: |
          echo "::notice::release PR (dev → main); branch naming and commitlint skipped"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install yamllint==1.35.1 check-jsonschema==0.28.4 \
            PyYAML==6.0.2 jsonschema==4.23.0
          shellcheck --version

      - name: Validate commit messages
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref != 'main' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # dev → main PRs only carry commits that were already checked on
          # their way into dev, so commitlint runs on feature PRs only.
          # Dependabot writes conventional subjects (prefix set in
          # dependabot.yml) but long footers, so it is skipped too.
          npm install --no-save --silent \
            @commitlint/cli@18.6.0 @commitlint/config-conventional@18.6.0
          npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: yamllint .github/workflows
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 160}}}' \
            .github/workflows

      - name: Validate GitHub workflow schemas
        run: |
          for file in .github/workflows/*.yml; do
            # smart-sync uses projects_v2_item which isn't in the public schema
            if [[ "$file" != *"smart-sync.yml" ]]; then
              check-jsonschema --builtin-schema github-workflows "$file"
            fi
          done

      - name: Validate skill / agent / command frontmatter
        run: python3 scripts/validate_frontmatter.py all

      - name: Verify @agent and @skill cross-references
        run: python3 scripts/check_agent_references.py

      - name: Verify documented counts match repo state
        run: python3 scripts/check_doc_counts.py

      - name: ShellCheck install/update/smoke scripts
        run: |
          # Severity=error blocks real bugs. SC2155/SC2115 style warnings
          # are tracked separately; bump severity after cleanup.
          shellcheck --severity=error \
            scripts/install.sh scripts/update.sh scripts/smoke_install.sh

      - name: Smoke-test install and update
        run: bash scripts/smoke_install.sh

      - name: Markdown internal-link check
        run: |
          npx --yes markdown-link-check@3.12.2 \
            --config .markdown-link-check.json \
            README.md CLAUDE.md NAVIGATION.md

      - name: Validate plugin marketplace (once it exists)
        if: hashFiles('.claude-plugin/marketplace.json') != ''
        run: |
          npm install -g --silent @anthropic-ai/claude-code
          claude plugin validate .

  automerge:
    name: Auto-merge
    needs: validate
    # Same-repo pull requests into dev only. Fork PRs never get here
    # with write access, and dev → main is merged by release.yml.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'github-actions[bot]' ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Decide and merge
        env:
          # A personal access token makes the merge trigger release.yml;
          # the default token cannot start other workflows.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
        run: bash .github/scripts/automerge.sh
